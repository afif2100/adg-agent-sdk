[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adg-agent-sdk"
version = "0.1.0"
description = "ADG SDK — scaffold AI Development Group compliant projects with a single CLI command."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "AI Development Group", email = "dev@adg.dev" },
]

dependencies = [
    "typer>=0.15.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/afif2100/adg-agent-sdk"
Source = "https://github.com/afif2100/adg-agent-sdk"

[project.scripts]
adg-sdk = "adg_agent_sdk.cli:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/adg_agent_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"src/adg_agent_sdk/templates" = "adg_agent_sdk/templates"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=adg_agent_sdk --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/adg_agent_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

exclude_lines = [
    "pragma: no cover",
    "if __name__ == \"__main__\":",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ARG", "B", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/adg_agent_sdk"]
